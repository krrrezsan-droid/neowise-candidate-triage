<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #draft { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" aria-labelledby="topic" hidden>
    <h2 id="topic"></h2>
    <p><strong>Черновик ответа</strong></p>
    <p id="draft"></p>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    const manualReview = "Черновик недоступен. Разберите заявку вручную.";
    const invalidInput = "Введите текст заявки.";
    let latestRequest = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequest;
      const text = message.value.trim();
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";

      if (!text) {
        status.textContent = invalidInput;
        message.focus();
        return;
      }

      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (requestId !== latestRequest) return;

        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = invalidInput;
        } else if (reply.ok && data?.status === "ready") {
          topic.textContent = topicLabels[data.topic];
          draft.textContent = data.draft;
          result.hidden = false;
          status.textContent = "Черновик готов.";
        } else {
          status.textContent = manualReview;
        }
      } catch {
        if (requestId === latestRequest) status.textContent = manualReview;
      }
    });
  </script>
</body>
</html>
